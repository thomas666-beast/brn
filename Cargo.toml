[package]
name = "brn"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-lc-rs = "1.19.0"
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs", "prefer-post-quantum"] }
zeroize = { version = "1.9.2", default-features = false, features = ["alloc"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
